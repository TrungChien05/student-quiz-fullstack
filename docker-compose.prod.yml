# ==============================================================================
# Docker Compose Production — Dành cho Máy ảo Azure VM (Ubuntu)
# Sử dụng Docker Image đã được GitHub Actions đóng gói sẵn trên GHCR
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentquizz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studentquizz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studentquizz-network

  gemini-proxy:
    image: alpine:latest
    container_name: gemini-proxy
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache tor >/dev/null &&
      mkdir -p /var/lib/tor && chown -R root:root /var/lib/tor && chmod 700 /var/lib/tor &&
      printf 'DataDirectory /var/lib/tor\nSocksPort 0.0.0.0:9050 NoIsolateClientAddr\nHTTPTunnelPort 0.0.0.0:8118 NoIsolateClientAddr\nExitNodes 194.15.115.212,{jp},{sg},{tw}\nMaxCircuitDirtiness 86400\n' > /etc/tor/torrc &&
      tor -f /etc/tor/torrc"
    volumes:
      - tor_data:/var/lib/tor
    networks:
      - studentquizz-network

  backend:
    image: ghcr.io/trungchien05/student-quiz-backend:latest
    container_name: student-quiz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gemini-proxy:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studentquizz}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      JWT_SECRET: ${JWT_SECRET:-studentquizz_prod_secret_key_must_be_at_least_256_bits_long}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-flash-lite-latest,gemini-flash-latest,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash}
      JAVA_TOOL_OPTIONS: "-Dhttps.proxyHost=gemini-proxy -Dhttps.proxyPort=8118 -Dhttp.nonProxyHosts=localhost|127.*|[::1]|postgres|backend|frontend"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dqy5ubmde}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-345989556296772}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-qPf9vTa7q9ecwlIsDaNRGVa-1-o}
    networks:
      - studentquizz-network

  frontend:
    image: ghcr.io/trungchien05/student-quiz-frontend:latest
    container_name: student-quiz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - studentquizz-network

networks:
  studentquizz-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  tor_data:
    driver: local

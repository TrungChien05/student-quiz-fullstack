name: CI/CD Pipeline (Build, Push GHCR & Deploy Azure VM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ─── GIAI ĐOẠN 1: KIỂM TRA BUILD CODE (CI) ──────────────────────────────────
  backend-build:
    name: 1. Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

  frontend-build:
    name: 2. Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  # ─── GIAI ĐOẠN 2: ĐÓNG GÓI & ĐẨY DOCKER IMAGE LÊN GHCR ─────────────────────
  build-and-push-ghcr:
    name: 3. Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/trungchien05/student-quiz-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/trungchien05/student-quiz-frontend:latest

  # ─── GIAI ĐOẠN 3: TỰ ĐỘNG TRIỂN KHAI LÊN MÁY ẢO AZURE (CD) ─────────────────
  deploy-azure-vm:
    name: 4. Deploy to Azure VM via SSH
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/student-quiz"

      - name: Pull Latest Images & Restart Containers on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if ! docker info >/dev/null 2>&1; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S sh -c 'echo "$USER ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$USER && chmod 440 /etc/sudoers.d/$USER' || true
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl reset-failed docker.socket docker.service || true
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart containerd docker || true
            fi
            cd /opt/student-quiz
            if [ ! -f /opt/student-quiz/.env ]; then
              printf "POSTGRES_DB=studentquizz\nPOSTGRES_USER=postgres\nPOSTGRES_PASSWORD=MatKhauDatabaseCucManh2026\nJWT_SECRET=KhoaBiMatJwtChoMayAoAzurePhaiDaiItNhat256BitsTroLen2026\nGEMINI_API_KEY=\n" > /opt/student-quiz/.env
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

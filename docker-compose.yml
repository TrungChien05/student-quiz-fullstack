version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: student-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentquizz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studentquizz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studentquizz-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-quiz-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studentquizz}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      JWT_SECRET: ${JWT_SECRET:-studentquizz_dev_secret_key_must_be_at_least_256_bits_long}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - studentquizz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student-quiz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - studentquizz-network

networks:
  studentquizz-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
